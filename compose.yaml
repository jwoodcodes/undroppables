
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: nextjs-dev
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.next
